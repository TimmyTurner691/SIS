#version: '3.8'

services:

  # =========================================
  # 1. SENSORES DE RED (Captura)
  # =========================================
  zeek:
    build: ./config/zeek/zeek_custom
    container_name: siem_zeek
    network_mode: "host"
    user: root
    cap_add:
        - NET_ADMIN
        - NET_RAW
    privileged: true
    environment:
      - INTERFACE=lo
    volumes:
      - ./logs/logs_zeek:/pcap
    restart: "no"
    security_opt: 
        - apparmor=unconfined

  snort:
    build: ./snort_core
    container_name: siem_snort
    network_mode: "host"
    privileged: true
    volumes:
      - ./logs/logs_snort:/var/log/snort
      - ./config/snort/snort_config/snort.conf:/etc/snort/snort.conf
      - ./config/snort/rules:/etc/snort/rules
    command: snort -q -i lo -c /etc/snort/snort.conf -l /var/log/snort -A fast -k none
    restart: always
    security_opt: 
        - apparmor=unconfined

  # =========================================
  # 2. TRANSPORTE (Filebeat -> Redis)
  # =========================================
  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.9
    container_name: siem_filebeat
    user: root
    restart: always
    volumes:
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs/logs_zeek/logs/live:/logs/zeek:ro
      - ./logs/logs_snort:/logs/snort:ro
    depends_on:
      - redis
    command: filebeat -e -strict.perms=false

  redis:
    image: redis:alpine
    container_name: siem_redis
    ports:
      - "6379:6379"
    restart: always

  # =========================================
  # 3. BASE DE DATOS HISTÓRICA
  # =========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: siem_elastic
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    restart: always

  # =========================================
  # 4. CEREBRO INTELIGENTE (Python Core)
  # =========================================
  cerebro:
    build: ./python_core
    container_name: siem_cerebro
    working_dir: /app
    volumes:
      - ./python_core:/app
      # Logs
      - ./logs/logs_zeek/logs/live:/var/log/zeek
      - ./logs/logs_snort:/var/log/snort
      - ./scripts:/scripts
      
      # --- CORRECCIÓN CEREBRO ---
      # Apuntamos a /app/archivo para que coincida con el código
      - ./ot_inventory.json:/app/ot_inventory.json
      - ./cve_report.csv:/app/cve_report.csv
      
    environment:
      - REDIS_HOST=redis
      - ELASTIC_HOST=elasticsearch
    depends_on:
      - redis
      - elasticsearch
    restart: always

  # =========================================
  # 5. DASHBOARD
  # =========================================
  dashboard:
    image: python:3.9-slim
    container_name: siem_dashboard
    working_dir: /app
    volumes:
      # Código fuente del dashboard
      - ./mi_dashboard:/app
      # Logs para visualización
      - ./logs/logs_snort:/var/log/snort:ro
      - ./logs/logs_zeek/logs/live:/var/log/zeek:ro
      
      # Scripts auxiliares
      - ./python_core:/python_core
      
      # --- CORRECCIÓN DASHBOARD (CRUCIAL) ---
      # Ahora el archivo se montará DENTRO de la carpeta de trabajo /app
      - ./ot_inventory.json:/app/ot_inventory.json
      - ./cve_report.csv:/app/cve_report.csv
      
    # Agregamos 'requests' a la instalación para que el scanner funcione
    command: >
      sh -c "pip install --upgrade pip &&
             pip install streamlit redis pandas elasticsearch plotly requests &&
             streamlit run app.py"
    ports:
      - "8501:8501"
    depends_on:
      - redis
      - elasticsearch
    restart: always

volumes:
  elastic_data:
