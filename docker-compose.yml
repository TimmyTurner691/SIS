services:
  zeek:
    build: ./sensores/zeek/zeek_custom
    container_name: siem_zeek
    network_mode: "host"
    user: root
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    environment:
      INTERFACE: ${SIS_CAPTURE_INTERFACE:-lo}
      SIS_SENSOR_MODE: ${SIS_SENSOR_MODE:-demo}
      SIS_SENSOR_PROMISCUOUS: ${SIS_SENSOR_PROMISCUOUS:-true}
    volumes:
      - ${SIS_ZEEK_LOGS_PATH:-./logs/logs_zeek}:/pcap
      - ${SIS_SENSOR_HEALTH_PATH:-./logs/sensor_health}:/sensor-health
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined

  snort:
    build: ./sensores/snort
    container_name: siem_snort
    network_mode: "host"
    privileged: true
    environment:
      SIS_CAPTURE_INTERFACE: ${SIS_CAPTURE_INTERFACE:-lo}
      SIS_SENSOR_MODE: ${SIS_SENSOR_MODE:-demo}
      SIS_SENSOR_PROMISCUOUS: ${SIS_SENSOR_PROMISCUOUS:-true}
      SIS_SIGNATURES_DIR: /signatures
    volumes:
      - ${SIS_SNORT_LOGS_PATH:-./logs/logs_snort}:/var/log/snort
      - ${SIS_SNORT_CONF_PATH:-./configuracion/snort/snort.conf}:/etc/snort/snort.conf:ro
      - ${SIS_SNORT_RULES_PATH:-./reglas_firmas/snort_rules}:/etc/snort/rules
      - ./reglas_firmas:/signatures
      - ${SIS_SENSOR_HEALTH_PATH:-./logs/sensor_health}:/sensor-health
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.9
    container_name: siem_filebeat
    user: root
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: ${SIS_REDIS_HOST:-redis}
      REDIS_PORT: ${SIS_REDIS_PORT:-6379}
      SIS_REDIS_KEY: ${SIS_REDIS_KEY:-sis_queue}
    volumes:
      - ./configuracion/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${SIS_ZEEK_LIVE_LOGS_PATH:-./logs/logs_zeek/logs/live}:/logs/zeek:ro
      - ${SIS_SNORT_LOGS_PATH:-./logs/logs_snort}:/logs/snort:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - redis
    command: filebeat -e -strict.perms=false

  redis:
    image: redis:7-alpine
    container_name: siem_redis
    command: redis-server --appendonly yes
    ports:
      - "${SIS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: siem_elastic
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: ${SIS_ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${SIS_ELASTIC_PORT:-9200}:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  cerebro:
    build: ./core/cerebro
    container_name: siem_cerebro
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    working_dir: /app
    env_file:
      - .env
    environment:
      REDIS_HOST: ${SIS_REDIS_HOST:-127.0.0.1}
      REDIS_PORT: ${SIS_REDIS_PORT:-6379}
      REDIS_KEY: ${SIS_REDIS_KEY:-sis_queue}
      ELASTIC_HOST: ${SIS_ELASTIC_HOST:-127.0.0.1}
      ELASTIC_PORT: ${SIS_ELASTIC_PORT:-9200}
      SIS_INDEX_NAME: ${SIS_INDEX_NAME:-sis-logs-v1}
      SIS_DISCOVERED_ASSETS_INDEX: ${SIS_DISCOVERED_ASSETS_INDEX:-sis-discovered-assets-v3}
      SIS_DISCOVERY_ACTIVE_SWEEP: ${SIS_DISCOVERY_ACTIVE_SWEEP:-true}
      SIS_DISCOVERY_SWEEP_PREFIX: ${SIS_DISCOVERY_SWEEP_PREFIX:-24}
      SIS_DISCOVERY_NMAP_TIMEOUT: ${SIS_DISCOVERY_NMAP_TIMEOUT:-60}
      SIS_DISCOVERY_PURGE_LEGACY_INDEXES_ON_START: ${SIS_DISCOVERY_PURGE_LEGACY_INDEXES_ON_START:-true}
      SIS_DISCOVERY_PURGE_LEGACY_INDEXES: ${SIS_DISCOVERY_PURGE_LEGACY_INDEXES:-sis-discovered-assets-v1,sis-discovered-assets-v2}
      SIS_DIRECT_LOG_POLL_ENABLED: ${SIS_DIRECT_LOG_POLL_ENABLED:-false}
      SIS_DIRECT_LOG_POLL_INTERVAL: ${SIS_DIRECT_LOG_POLL_INTERVAL:-1.0}
      SIS_FLOOD_WINDOW_SECONDS: ${SIS_FLOOD_WINDOW_SECONDS:-5}
      SIS_FLOOD_FLOW_MIN_EVENTS: ${SIS_FLOOD_FLOW_MIN_EVENTS:-120}
      SIS_FLOOD_FLOW_MIN_EPS: ${SIS_FLOOD_FLOW_MIN_EPS:-20}
      SIS_FLOOD_DESTINATION_MIN_EVENTS: ${SIS_FLOOD_DESTINATION_MIN_EVENTS:-250}
      SIS_FLOOD_DESTINATION_MIN_EPS: ${SIS_FLOOD_DESTINATION_MIN_EPS:-40}
      SIS_FLOOD_ICMP_MIN_EVENTS: ${SIS_FLOOD_ICMP_MIN_EVENTS:-1000}
      SIS_FLOOD_ICMP_MIN_EPS: ${SIS_FLOOD_ICMP_MIN_EPS:-150}
      SIS_FLOOD_MAX_EVENT_LAG_SECONDS: ${SIS_FLOOD_MAX_EVENT_LAG_SECONDS:-30}
      SIS_EVENT_DEDUP_TTL_SECONDS: ${SIS_EVENT_DEDUP_TTL_SECONDS:-600}
      SIS_EVENT_MAX_INGEST_AGE_SECONDS: ${SIS_EVENT_MAX_INGEST_AGE_SECONDS:-120}
      SIS_AI_MIN_BASELINE_SAMPLES: ${SIS_AI_MIN_BASELINE_SAMPLES:-30}
      SIS_AI_BASELINE_WINDOW: ${SIS_AI_BASELINE_WINDOW:-300}
      SIS_AI_CONTAMINATION: ${SIS_AI_CONTAMINATION:-0.02}
      SIS_INVENTORY_PATH: ${SIS_INVENTORY_PATH:-/app/ot_inventory.json}
      SIS_SMTP_SERVER: ${SIS_SMTP_SERVER:-}
      SIS_SMTP_PORT: ${SIS_SMTP_PORT:-587}
      SIS_SMTP_SENDER_EMAIL: ${SIS_SMTP_SENDER_EMAIL:-}
      SIS_SMTP_SENDER_PASSWORD: ${SIS_SMTP_SENDER_PASSWORD:-}
      SIS_SMTP_RECEIVER_EMAIL: ${SIS_SMTP_RECEIVER_EMAIL:-}
      SIS_SMTP_USE_TLS: ${SIS_SMTP_USE_TLS:-true}
    volumes:
      - ./core/cerebro:/app
      - ${SIS_ZEEK_LIVE_LOGS_PATH:-./logs/logs_zeek/logs/live}:/var/log/zeek
      - ${SIS_SNORT_LOGS_PATH:-./logs/logs_snort}:/var/log/snort
      - ./scripts_demo:/scripts_demo
      - ./ot_inventory.json:/app/ot_inventory.json:ro
      - ./cve_report.csv:/app/cve_report.csv:ro
    depends_on:
      - redis
      - elasticsearch
    restart: unless-stopped

  dashboard:
    build: ./dashboard/streamlit
    container_name: siem_dashboard
    working_dir: /app
    command: >
      streamlit run app.py
      --server.address=${SIS_DASHBOARD_LISTEN_ADDRESS:-0.0.0.0}
      --server.port=${SIS_DASHBOARD_INTERNAL_PORT:-8501}
    env_file:
      - .env
    environment:
      SIS_DASHBOARD_ELASTIC_HOST: ${SIS_ELASTIC_HOST:-elasticsearch}
      SIS_DASHBOARD_ELASTIC_PORT: ${SIS_ELASTIC_PORT:-9200}
      SIS_DASHBOARD_REDIS_HOST: ${SIS_REDIS_HOST:-redis}
      SIS_DASHBOARD_REDIS_PORT: ${SIS_REDIS_PORT:-6379}
      SIS_DASHBOARD_INDEX: ${SIS_INDEX_NAME:-sis-logs-v1}
      SIS_DASHBOARD_DISCOVERED_ASSETS_INDEX: ${SIS_DISCOVERED_ASSETS_INDEX:-sis-discovered-assets-v3}
      SIS_DASHBOARD_INVENTORY_PATH: ${SIS_DASHBOARD_INVENTORY_PATH:-/app/ot_inventory.json}
      SIS_SENSOR_HEALTH_DIR: /sensor-health
      SIS_SIGNATURES_DIR: /signatures
    volumes:
      - ./dashboard/streamlit:/app
      - ${SIS_SNORT_LOGS_PATH:-./logs/logs_snort}:/var/log/snort:ro
      - ${SIS_ZEEK_LIVE_LOGS_PATH:-./logs/logs_zeek/logs/live}:/var/log/zeek:ro
      - ${SIS_SENSOR_HEALTH_PATH:-./logs/sensor_health}:/sensor-health:ro
      - ./reglas_firmas:/signatures
      - ./ot_inventory.json:/app/ot_inventory.json
      - ./ot_inventory.json:/app/ot_inventory.json
    ports:
      - "${SIS_MANAGEMENT_BIND_IP:-0.0.0.0}:${SIS_DASHBOARD_PORT:-8501}:${SIS_DASHBOARD_INTERNAL_PORT:-8501}"
    depends_on:
      - redis
      - elasticsearch
    restart: unless-stopped


  suricata:
    image: jasonish/suricata:7.0
    container_name: siem_suricata
    profiles: ["suricata"]
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: >
      suricata -i ${SIS_CAPTURE_INTERFACE:-lo}
      -l /var/log/suricata
    volumes:
      - ${SIS_SURICATA_LOGS_PATH:-./logs/logs_suricata}:/var/log/suricata
    restart: unless-stopped

  nginx_proxy:
    image: nginx:1.27-alpine
    container_name: siem_nginx_proxy
    profiles: ["proxy"]
    ports:
      - "${SIS_PROXY_PORT:-8080}:80"
    volumes:
      - ./configuracion/nginx/sis.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dashboard
    restart: unless-stopped

volumes:
  elastic_data:
  redis_data:
  filebeat_data:
