version: '3.8'

services:

  # =========================================
  # 1. SENSORES DE RED (Captura)
  # =========================================
  zeek:
    build: ./config/zeek/zeek_custom
    container_name: siem_zeek
    network_mode: "host"
    privileged: true
    environment:
      - INTERFACE=any
    volumes:
      # Zeek escribe aquí. Asumimos que dentro genera la carpeta /logs/live
      - ./logs/logs_zeek:/pcap
    restart: always

  snort:
    build: ./snort_core
    container_name: siem_snort
    network_mode: "host"
    privileged: true
    volumes:
      - ./logs/logs_snort:/var/log/snort
      - ./config/snort/snort_config/snort.conf:/etc/snort/snort.conf
      - ./config/snort/rules:/etc/snort/rules
    command: snort -q -i wlp2s0 -c /etc/snort/snort.conf -l /var/log/snort -A fast -k none
    restart: always

  # =========================================
  # 2. TRANSPORTE (Filebeat -> Redis)
  # =========================================
  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.9
    container_name: siem_filebeat
    user: root
    restart: always
    volumes:
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Filebeat también necesita apuntar a la carpeta LIVE
      - ./logs/logs_zeek/logs/live:/logs/zeek:ro
      - ./logs/logs_snort:/logs/snort:ro
    depends_on:
      - redis
    command: filebeat -e -strict.perms=false

  redis:
    image: redis:alpine
    container_name: siem_redis
    ports:
      - "6379:6379"
    restart: always

  # =========================================
  # 3. BASE DE DATOS HISTÓRICA
  # =========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: siem_elastic
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    restart: always

  # =========================================
  # 4. CEREBRO INTELIGENTE (Python Core)
  # =========================================
  cerebro:
    build: ./python_core
    container_name: siem_cerebro
    volumes:
      - ./python_core:/app
      
      # --- CORRECCIÓN CLAVE ---
      # Apuntamos directo a donde Zeek guarda los archivos vivos
      - ./logs/logs_zeek/logs/live:/var/log/zeek
      
      - ./logs/logs_snort:/var/log/snort
      - ./scripts:/scripts
    environment:
      - REDIS_HOST=redis
      - ELASTIC_HOST=elasticsearch
    depends_on:
      - redis
      - elasticsearch
    restart: always

  # =========================================
  # 5. DASHBOARD
  # =========================================
  dashboard:
    image: python:3.9-slim
    container_name: siem_dashboard
    working_dir: /app
    volumes:
      - ./mi_dashboard:/app
      - ./logs/logs_snort:/var/log/snort:ro
      
      # --- CORRECCIÓN CLAVE TAMBIÉN AQUÍ ---
      # El dashboard también necesita ver los logs vivos para mostrarlos
      - ./logs/logs_zeek/logs/live:/var/log/zeek:ro
      
    command: >
      sh -c "pip install --upgrade pip &&
             pip install streamlit redis pandas elasticsearch plotly &&
             streamlit run app.py"
    ports:
      - "8501:8501"
    depends_on:
      - redis
      - elasticsearch
    restart: always

volumes:
  elastic_data: