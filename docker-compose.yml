services:

  # ─────────────────────────────────────────────
  # SENSORES – necesitan acceso promiscuo a la NIC
  # Quedan en host-network intencionalmente.
  # ─────────────────────────────────────────────
  zeek:
    build: ./sensores/zeek/zeek_custom
    container_name: siem_zeek
    network_mode: "host"          # requerido: captura promiscua en NIC física
    user: root
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    environment:
      INTERFACE: ${SIS_CAPTURE_INTERFACE:-lo}
      SIS_SENSOR_MODE: ${SIS_SENSOR_MODE:-demo}
      SIS_SENSOR_PROMISCUOUS: ${SIS_SENSOR_PROMISCUOUS:-true}
      TZ: America/Santiago
    volumes:
      - ${SIS_ZEEK_LOGS_PATH:-./logs/logs_zeek}:/pcap
      - ${SIS_SENSOR_HEALTH_PATH:-./logs/sensor_health}:/sensor-health
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined

  snort:
    build: ./sensores/snort
    container_name: siem_snort
    network_mode: "host"          # requerido: captura promiscua en NIC física
    privileged: true
    environment:
      SIS_CAPTURE_INTERFACE: ${SIS_CAPTURE_INTERFACE:-lo}
      SIS_SENSOR_MODE: ${SIS_SENSOR_MODE:-demo}
      SIS_SENSOR_PROMISCUOUS: ${SIS_SENSOR_PROMISCUOUS:-true}
      TZ: America/Santiago
    volumes:
      - ${SIS_SNORT_LOGS_PATH:-./logs/logs_snort}:/var/log/snort
      - ${SIS_SNORT_CONF_PATH:-./configuracion/snort/snort.conf}:/etc/snort/snort.conf:ro
      - ${SIS_SNORT_RULES_PATH:-./reglas_firmas/snort_rules}:/etc/snort/rules:ro
      - ${SIS_SENSOR_HEALTH_PATH:-./logs/sensor_health}:/sensor-health
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined

  # ─────────────────────────────────────────────
  # RED INTERNA – todos los servicios de aplicación
  # se comunican exclusivamente por siem_internal_net.
  # Ninguna base de datos expone puertos al host.
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: siem_redis
    command: redis-server --appendonly yes
    # Sin "ports": Redis NO está accesible desde el host.
    # Solo cerebro y filebeat lo alcanzan por red interna.
    volumes:
      - redis_data:/data
    networks:
      - siem_internal_net
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: siem_elastic
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: ${SIS_ES_JAVA_OPTS:--Xms512m -Xmx512m}
      TZ: America/Santiago
    # Sin "ports": Elasticsearch NO está accesible desde el host.
    # Solo cerebro y dashboard lo alcanzan por red interna.
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - siem_internal_net
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.9
    container_name: siem_filebeat
    user: root
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: ${SIS_REDIS_HOST:-redis}
      REDIS_PORT: ${SIS_REDIS_PORT:-6379}
      SIS_REDIS_KEY: ${SIS_REDIS_KEY:-sis_queue}
      TZ: America/Santiago
    volumes:
      - ./configuracion/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${SIS_ZEEK_LIVE_LOGS_PATH:-./logs/logs_zeek/logs/live}:/logs/zeek:ro
      - ${SIS_SNORT_LOGS_PATH:-./logs/logs_snort}:/logs/snort:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - redis
    networks:
      - siem_internal_net
    command: filebeat -e -strict.perms=false

  cerebro:
    build: ./core/cerebro
    container_name: siem_cerebro
    # network_mode: "host" ELIMINADO – ahora usa red puente interna.
    # cap_add se mantiene porque cerebro realiza escaneos Nmap activos.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    working_dir: /app
    env_file:
      - .env
    environment:
      # Usa nombres DNS de Docker en lugar de 127.0.0.1
      REDIS_HOST: ${SIS_REDIS_HOST:-redis}
      REDIS_PORT: ${SIS_REDIS_PORT:-6379}
      REDIS_KEY: ${SIS_REDIS_KEY:-sis_queue}
      ELASTIC_HOST: ${SIS_ELASTIC_HOST:-elasticsearch}
      ELASTIC_PORT: ${SIS_ELASTIC_PORT:-9200}
      SIS_INDEX_NAME: ${SIS_INDEX_NAME:-sis-logs-v1}
      SIS_DISCOVERED_ASSETS_INDEX: ${SIS_DISCOVERED_ASSETS_INDEX:-sis-discovered-assets-v3}
      SIS_DISCOVERY_ACTIVE_SWEEP: ${SIS_DISCOVERY_ACTIVE_SWEEP:-true}
      SIS_DISCOVERY_SWEEP_PREFIX: ${SIS_DISCOVERY_SWEEP_PREFIX:-24}
      SIS_DISCOVERY_NMAP_TIMEOUT: ${SIS_DISCOVERY_NMAP_TIMEOUT:-60}
      SIS_DISCOVERY_PURGE_LEGACY_INDEXES_ON_START: ${SIS_DISCOVERY_PURGE_LEGACY_INDEXES_ON_START:-true}
      SIS_DISCOVERY_PURGE_LEGACY_INDEXES: ${SIS_DISCOVERY_PURGE_LEGACY_INDEXES:-sis-discovered-assets-v1,sis-discovered-assets-v2}
      SIS_DIRECT_LOG_POLL_ENABLED: ${SIS_DIRECT_LOG_POLL_ENABLED:-true}
      SIS_DIRECT_LOG_POLL_INTERVAL: ${SIS_DIRECT_LOG_POLL_INTERVAL:-1.0}
      SIS_INVENTORY_PATH: ${SIS_INVENTORY_PATH:-/app/ot_inventory.json}
      SIS_SMTP_SERVER: ${SIS_SMTP_SERVER:-}
      SIS_SMTP_PORT: ${SIS_SMTP_PORT:-587}
      SIS_SMTP_SENDER_EMAIL: ${SIS_SMTP_SENDER_EMAIL:-}
      SIS_SMTP_SENDER_PASSWORD: ${SIS_SMTP_SENDER_PASSWORD:-}
      SIS_SMTP_RECEIVER_EMAIL: ${SIS_SMTP_RECEIVER_EMAIL:-}
      SIS_SMTP_USE_TLS: ${SIS_SMTP_USE_TLS:-true}
      TZ: America/Santiago
    volumes:
      - ./core/cerebro:/app
      - ${SIS_ZEEK_LIVE_LOGS_PATH:-./logs/logs_zeek/logs/live}:/var/log/zeek
      - ${SIS_SNORT_LOGS_PATH:-./logs/logs_snort}:/var/log/snort
      - ./scripts_demo:/scripts_demo
      - ./ot_inventory.json:/app/ot_inventory.json:ro
      - ./cve_report.csv:/app/cve_report.csv:ro
    depends_on:
      - redis
      - elasticsearch
    networks:
      - siem_internal_net
    restart: unless-stopped

  dashboard:
    build: ./dashboard/web
    container_name: siem_dashboard_web
    working_dir: /app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - TZ=America/Santiago
      # URL pública (browser-side): Next.js la inyecta en el bundle del cliente.
      # Apunta al proxy Nginx usando la IP de la interfaz de gestión del host.
      - NEXT_PUBLIC_API_BASE_URL=http://${SIS_PUBLIC_IP:-localhost}:${SIS_PROXY_PORT:-8080}/api/cerebro
      # URL interna (server-side): Next.js la usa en SSR/API routes dentro del contenedor.
      - CEREBRO_INTERNAL_URL=http://cerebro:8000
      # Host de Elasticsearch por red interna (para API routes de Next.js)
      - SIS_DASHBOARD_ELASTIC_HOST=elasticsearch
      - SIS_DASHBOARD_ELASTIC_PORT=9200
    volumes:
      - ./dashboard/web:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    # Puerto 3000 solo accesible por nginx_proxy en red interna.
    # Si necesitas acceder directamente durante desarrollo, descomenta:
    # ports:
    #   - "${SIS_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - cerebro
    networks:
      - siem_internal_net
    restart: unless-stopped

  nginx_proxy:
    image: nginx:1.27-alpine
    container_name: siem_nginx_proxy
    # Profile eliminado: nginx es el único punto de entrada y debe arrancar siempre.
    ports:
      - "${SIS_PROXY_PORT:-8080}:80"   # único puerto expuesto al host
    volumes:
      - ./configuracion/nginx/sis.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dashboard
      - cerebro
    networks:
      - siem_internal_net
    restart: unless-stopped

networks:
  siem_internal_net:
    driver: bridge
    name: siem_internal_net

volumes:
  elastic_data:
  redis_data:
  filebeat_data:
