server {
    listen 80;
    server_name _;

    # ── Cabeceras de seguridad (hardening) ───────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # Oculta la versión de Nginx en respuestas de error
    server_tokens off;

    # ── Proxy → Cerebro (API backend) ────────────────────────────────────────
    # Todas las peticiones que llegan con prefijo /api/ se redirigen al
    # contenedor cerebro usando su nombre DNS interno de Docker.
    # El frontend de Next.js debe llamar a  /api/cerebro/<ruta>
    # y Nginx hace el rewrite quitando el prefijo antes de reenviar.
    location /api/cerebro/ {
        rewrite ^/api/cerebro/(.*)$ /$1 break;
        proxy_pass         http://cerebro:8000;
        proxy_http_version 1.1;

        # $http_host conserva el puerto original, vital para evitar 403 de CORS/Turbopack
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts razonables para llamadas de API
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ── Proxy → Dashboard (Next.js frontend) ─────────────────────────────────
    # El catch-all final envía todo lo demás al contenedor dashboard.
    # Incluye soporte para WebSockets (Hot-Module Replacement en desarrollo).
    location / {
        proxy_pass         http://dashboard:3000;
        proxy_http_version 1.1;

        # $http_host preserva IP:Puerto, evitando que Turbopack rechace HMR y estáticos con 403
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket – necesario para Next.js HMR y cualquier WS del frontend
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400;
    }
}
